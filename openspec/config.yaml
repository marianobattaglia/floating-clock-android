schema: spec-driven

context: |
  FloatingClock is a single-module Android TV app with a floating clock overlay
  and a background alarm. Stack: Kotlin, Jetpack Compose for TV, Android
  services, SharedPreferences and AlarmManager. No backend.
  The app uses minSdk 21 and compileSdk/targetSdk 36.
  Dependency versions live in gradle/libs.versions.toml.
  MainActivity owns settings UI; FloatingClockService owns the overlay;
  AlarmScheduler, AlarmReceiver and AlarmSoundService handle alarms.
  Preserve D-pad navigation, visible focus, Back behavior, persisted preference
  compatibility, API guards and service/resource cleanup.
  Read AGENTS.md for repository guidance and validation commands.
  There are currently no test sources. Build/lint do not replace device checks.

rules:
  proposal:
    - Describe the user-visible behavior and scope of the change.
  specs:
    - Include relevant TV remote navigation and permission-denied scenarios.
    - For alarm or overlay changes, cover lifecycle and affected Android API levels.
  tasks:
    - Include build/lint for Android code changes and relevant device checks.
    - Distinguish automated checks from manual Android TV checks.

